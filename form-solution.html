<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semantic Form Demo</title>
</head>

<body>

  <header>
    <p class="site-title">Semantic Form <span>/ FMI Demo</span></p>
    <h1>Student Registration</h1>
  </header>

  <main>
    <form action="/submit" method="post">

      <fieldset>
        <legend>Personal Information</legend>

        <div class="form-group">
          <label for="full-name">Full name</label>
          <input type="text" id="full-name" name="full_name" autocomplete="name" placeholder="Jana Novák" required />
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="jana@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password"
            placeholder="Min. 8 characters" />
        </div>

        <div class="form-group">
          <label for="dob">Date of birth</label>
          <input type="date" id="dob" name="dob" />
        </div>

        <div class="form-group">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+359 88 123 4567" />
        </div>
      </fieldset>

      <fieldset>
        <legend>Academic Details</legend>

        <div class="form-group">
          <label for="faculty">Faculty number</label>
          <input type="number" id="faculty" name="faculty_number" min="10000" max="99999" placeholder="81234" />
        </div>

        <div class="form-group">
          <label for="year">Year of study</label>
          <input type="range" id="year" name="year" min="1" max="4" value="1" />
          <output for="year" id="year-output">1</output>
        </div>

        <div class="form-group">
          <label for="degree">Degree programme</label>
          <select id="degree" name="degree">
            <option value="">— choose —</option>
            <option value="cs">Computer Science</option>
            <option value="math">Mathematics</option>
            <option value="is">Information Systems</option>
            <option value="ai">Artificial Intelligence</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Preferences</legend>

        <div class="form-group">
          <p class="group-label">Preferred contact method</p>
          <label class="radio-label">
            <input type="radio" name="contact" value="email" checked /> Email
          </label>
          <label class="radio-label">
            <input type="radio" name="contact" value="phone" /> Phone
          </label>
          <label class="radio-label">
            <input type="radio" name="contact" value="none" /> No contact
          </label>
        </div>

        <div class="form-group">
          <p class="group-label">Interests</p>
          <label class="check-label">
            <input type="checkbox" name="interests" value="web" /> Web development
          </label>
          <label class="check-label">
            <input type="checkbox" name="interests" value="data" /> Data science
          </label>
          <label class="check-label">
            <input type="checkbox" name="interests" value="security" /> Security
          </label>
          <label class="check-label">
            <input type="checkbox" name="interests" value="games" /> Game development
          </label>
        </div>

        <div class="form-group">
          <label for="website">Personal website</label>
          <input type="url" id="website" name="website" placeholder="https://example.com" />
        </div>

        <div class="form-group">
          <label for="bio">Short bio</label>
          <textarea id="bio" name="bio" rows="4" placeholder="Tell us a little about yourself…"></textarea>
        </div>

        <div class="form-group">
          <label for="avatar">Profile photo</label>
          <input type="file" id="avatar" name="avatar" accept="image/*" />
        </div>

        <div class="form-group">
          <label for="color">Favourite colour</label>
          <input type="color" id="color" name="color" value="#2563eb" />
        </div>
      </fieldset>

      <div class="form-actions">
        <button type="reset">Clear</button>
        <button type="submit">Register</button>
      </div>
    </form>
  </main>

  <footer>
    <p>Built for the <strong>FMI Frontend</strong> course</p>
  </footer>
</body>

</html>
