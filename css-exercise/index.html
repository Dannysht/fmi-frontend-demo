<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Live Exercise</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">My Site</header>

  <!-- Profile Card -->
  <div class="card">
    <span id="badge">NEW</span>

    <!-- Avatar — border-radius circle demo -->
    <img class="avatar" src="https://i.pravatar.cc/120" alt="Profile picture">

    <h2>Jane Doe</h2>
    <p class="role">Frontend Developer</p>
    <input type="text" placeholder="Search...">

    <nav class="card-nav">
      <a href="#">About</a>
      <a href="#">Work</a>
      <a href="#">Contact</a>
    </nav>

    <ul class="skills">
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>React</li>
    </ul>

    <!-- ::before / ::after demo -->
    <p class="label">Required field</p>
  </div>

  <!-- Box Model Demo -->
  <section class="box-model-demo">
    <h3>Box Model Demo</h3>

    <div class="box box-border">
      <p>box-sizing: border-box</p>
      <p>width: 300px</p>
      <p>padding: 30px</p>
    </div>

    <div class="box content-box">
      <p>box-sizing: content-box</p>
      <p>width: 300px</p>
      <p>padding: 30px</p>
    </div>
  </section>

  <div class="cookie-banner">We use cookies.</div>

</body>
</html>
